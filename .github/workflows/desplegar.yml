name: Desplegar página

# Cuándo corre:
#  - push a main: compila, actualiza la infraestructura (si cambió) y publica.
#  - cada 6 horas: vuelve a leer los eventos de Meetup y publica la versión nueva.
#  - cuando alguien publica o cambia algo en Strapi (Strapi lanza este flujo con workflow_dispatch).
#    Strapi puede vivir en Heroku (variable HEROKU_APP, gratis con el Student Pack) o en AWS (CMS_ACTIVO=true).
#  - a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      origen:
        description: Quién lanza el flujo (Strapi manda "cms" para solo recompilar la página)
        default: manual

concurrency:
  group: desplegar
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # para entrar a AWS con OIDC (sin llaves guardadas)
  pages: write      # para la vista previa en GitHub Pages
  actions: read

env:
  STACK: aws-sbg-web
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  # ------------------------------------------------------------------ compilación y pruebas
  compilar:
    runs-on: ubuntu-latest
    outputs:
      con_aws: ${{ steps.aws.outputs.listo }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Leer eventos de Meetup
        run: node scripts/fetch-meetup-events.mjs
      - name: Leer contenido de Strapi
        run: node scripts/fetch-cms.mjs
        env:
          STRAPI_URL: ${{ vars.STRAPI_URL }}
          STRAPI_TOKEN: ${{ secrets.STRAPI_TOKEN }}
      - name: Compilar
        run: npm run build
      - name: ¿AWS ya está configurado?
        id: aws
        run: echo "listo=${{ vars.AWS_ROLE_ARN != '' }}" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ infraestructura (SAM)
  infraestructura:
    needs: compilar
    if: needs.compilar.outputs.con_aws == 'true' && github.event_name != 'schedule' && inputs.origen != 'cms'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Desplegar stack
        working-directory: backend
        run: |
          sam build
          sam deploy \
            --stack-name "$STACK" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "TurnstileSecret=${{ secrets.TURNSTILE_SECRET_KEY || '1x0000000000000000000000000000000AA' }}" \
              "NotifyEmail=${{ vars.NOTIFY_EMAIL || 'aws.unistmo@gmail.com' }}" \
              "CreateEmailIdentity=${{ vars.CREATE_EMAIL_IDENTITY || 'true' }}" \
              "DomainName=${{ vars.DOMAIN_NAME }}" \
              "CertificateArn=${{ vars.CERTIFICATE_ARN }}"

  # ------------------------------------------------------------------ publicar en AWS
  publicar-aws:
    needs: [compilar, infraestructura]
    if: always() && needs.compilar.outputs.con_aws == 'true' && needs.compilar.result == 'success' && (needs.infraestructura.result == 'success' || needs.infraestructura.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: ${{ steps.salidas.outputs.SiteUrl }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Leer salidas del stack
        id: salidas
        run: |
          aws cloudformation describe-stacks --stack-name "$STACK" \
            --query 'Stacks[0].Outputs[].[OutputKey,OutputValue]' --output text |
            while read -r k v; do echo "$k=$v" >> "$GITHUB_OUTPUT"; done
      - run: npm ci
      - run: node scripts/fetch-meetup-events.mjs
      - name: Leer contenido de Strapi
        run: node scripts/fetch-cms.mjs
        env:
          STRAPI_URL: ${{ vars.STRAPI_URL }}
          STRAPI_TOKEN: ${{ secrets.STRAPI_TOKEN }}
      - name: Compilar con la API real
        run: npm run build
        env:
          PUBLIC_API_URL: ${{ steps.salidas.outputs.ApiUrl }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          SITE_URL: ${{ steps.salidas.outputs.SiteUrl }}
      - name: Subir a S3
        run: |
          BUCKET="${{ steps.salidas.outputs.SiteBucketName }}"
          # Archivos con huella en el nombre (_astro, video, img): caché de un año
          aws s3 sync dist "s3://$BUCKET" --delete --exclude "*.html" --cache-control "public,max-age=31536000,immutable"
          # HTML: siempre se revalida para que los cambios se vean al instante
          aws s3 sync dist "s3://$BUCKET" --exclude "*" --include "*.html" --cache-control "public,max-age=0,must-revalidate"
      - name: Limpiar la caché de CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.salidas.outputs.DistributionId }}" --paths "/*" > /dev/null

  # ------------------------------------------------------------------ prueba de la imagen del CMS
  # Compila la imagen de Strapi (sin publicarla) cuando cambia cms/, aunque AWS no esté configurado.
  probar-cms:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: ¿Cambió el CMS?
        id: cambio
        run: git diff --name-only HEAD~1 HEAD | grep -q '^cms/' && echo "si=true" >> "$GITHUB_OUTPUT" || true
      - name: Compilar la imagen
        if: steps.cambio.outputs.si == 'true'
        run: docker build -t cms-prueba cms
      - name: Arrancar Strapi como en AWS (SQLite) y como en Heroku (Postgres, otro puerto, sin root)
        if: steps.cambio.outputs.si == 'true'
        run: |
          r() { openssl rand -hex 24; }
          secretos() { printf 'APP_KEYS=%s,%s\nAPI_TOKEN_SALT=%s\nADMIN_JWT_SECRET=%s\nTRANSFER_TOKEN_SALT=%s\nJWT_SECRET=%s\nENCRYPTION_KEY=%s\n' "$(r)" "$(r)" "$(r)" "$(r)" "$(r)" "$(r)" "$(r)"; }
          secretos > aws.env
          secretos > heroku.env
          docker network create red
          docker run -d --name pg --network red -e POSTGRES_PASSWORD=prueba postgres:17-alpine
          docker run -d --name cms-aws -p 1337:1337 --env-file aws.env -e DATABASE_FILENAME=.tmp/data.db cms-prueba
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres > /dev/null 2>&1 && break; sleep 2; done
          docker run -d --name cms-heroku --network red --user 4321 -p 5000:5000 --env-file heroku.env -e PORT=5000 -e IS_PROXIED=true \
            -e DATABASE_CLIENT=postgres -e DATABASE_URL=postgres://postgres:prueba@pg:5432/postgres cms-prueba
          for c in cms-aws:1337 cms-heroku:5000; do
            nombre=${c%%:*}; puerto=${c##*:}
            for i in $(seq 1 60); do curl -sf "http://localhost:$puerto/_health" > /dev/null && break; sleep 3; done
            # Los datos iniciales se cargan en segundo plano, después de que el servidor ya responde
            for i in $(seq 1 30); do docker logs "$nombre" 2>&1 | grep -q "integrantes y" && break; sleep 3; done
            echo "== $nombre"; docker logs "$nombre" 2>&1 | grep -E "Datos iniciales|Token|started|rror" || true
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$puerto/admin")" = "200"
            docker logs "$nombre" 2>&1 | grep -q "integrantes y"
          done

  # ------------------------------------------------------------------ CMS (Strapi) en AWS
  # Se activa con la variable CMS_ACTIVO=true. Crea la instancia y compila la imagen solo si cambió cms/.
  cms:
    needs: compilar
    if: needs.compilar.outputs.con_aws == 'true' && vars.CMS_ACTIVO == 'true' && github.event_name != 'schedule' && inputs.origen != 'cms'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Infraestructura del CMS
        run: |
          aws cloudformation deploy --stack-name "$STACK-cms" --template-file infra/cms.yaml             --capabilities CAPABILITY_NAMED_IAM --no-fail-on-empty-changeset
      - name: Leer salidas del CMS
        id: cms
        run: |
          aws cloudformation describe-stacks --stack-name "$STACK-cms"             --query 'Stacks[0].Outputs[].[OutputKey,OutputValue]' --output text |
            while read -r k v; do echo "$k=$v" >> "$GITHUB_OUTPUT"; done
      - name: ¿Hay que compilar la imagen?
        id: imagen
        run: |
          REPO="${{ steps.cms.outputs.RepositoryUri }}"
          if ! aws ecr describe-images --repository-name "${REPO##*/}" --image-ids imageTag=latest > /dev/null 2>&1              || git diff --name-only HEAD~1 HEAD | grep -q '^cms/'; then echo "si=true" >> "$GITHUB_OUTPUT"; fi
      - name: Compilar y subir la imagen (arm64)
        if: steps.imagen.outputs.si == 'true'
        run: |
          REPO="${{ steps.cms.outputs.RepositoryUri }}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPO%%/*}"
          docker build -t "$REPO:latest" -t "$REPO:${{ github.sha }}" cms
          docker push --all-tags "$REPO"
      - name: Reiniciar Strapi con la imagen nueva
        if: steps.imagen.outputs.si == 'true'
        run: |
          aws ssm send-command --instance-ids "${{ steps.cms.outputs.InstanceId }}" --document-name AWS-RunShellScript             --parameters 'commands=["/usr/local/bin/cms-actualizar"]' --comment "Actualizar CMS" > /dev/null
          echo "CMS: ${{ steps.cms.outputs.CmsUrl }}/admin" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ CMS (Strapi) en Heroku
  # Se activa con la variable HEROKU_APP (nombre de la app) y el secreto HEROKU_API_KEY.
  # Con el GitHub Student Developer Pack, Heroku da US$13 al mes: dyno Eco (US$5, variable HEROKU_DYNO) + Postgres Essential-0 (US$5).
  # Configura la app (contenedor y variables) y publica la imagen solo si cambió cms/ o si aún no hay ninguna.
  cms-heroku:
    if: vars.HEROKU_APP != '' && github.event_name != 'schedule' && inputs.origen != 'cms'
    runs-on: ubuntu-latest
    env:
      APP: ${{ vars.HEROKU_APP }}
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Preparar la app (contenedor y variables)
        id: app
        run: |
          h() { curl -sS --fail-with-body -H "Accept: application/vnd.heroku+json; version=3" -H "Authorization: Bearer $HEROKU_API_KEY" -H "Content-Type: application/json" "$@"; }
          API="https://api.heroku.com/apps/$APP"
          h -X PATCH "$API" -d '{"build_stack":"container"}' > /dev/null
          actuales=$(h "$API/config-vars")
          if [ "$(jq -r 'has("DATABASE_URL")' <<< "$actuales")" != true ]; then
            echo "::error::Falta la base de datos: en Heroku → Resources agrega «Heroku Postgres» (plan Essential-0)."
            exit 1
          fi
          [ "$(jq -r 'has("CLOUDINARY_URL")' <<< "$actuales")" = true ] ||
            echo "::warning::Sin CLOUDINARY_URL las fotos que suban se borran cada vez que Heroku reinicia la app."
          # Los secretos de Strapi se generan una sola vez; si ya existen no se tocan
          r() { openssl rand -base64 32 | tr -d '\n'; }
          secretos=$(jq -n --arg k "$(r),$(r)" --arg a "$(r)" --arg b "$(r)" --arg c "$(r)" --arg d "$(r)" --arg e "$(r)" \
            '{APP_KEYS: $k, API_TOKEN_SALT: $a, ADMIN_JWT_SECRET: $b, TRANSFER_TOKEN_SALT: $c, JWT_SECRET: $d, ENCRYPTION_KEY: $e}')
          fijas=$(jq -n --arg repo "$GITHUB_REPOSITORY" '{NODE_ENV: "production", IS_PROXIED: "true", DATABASE_CLIENT: "postgres",
            DATABASE_SSL: "true", DATABASE_SSL_REJECT_UNAUTHORIZED: "false", GITHUB_REPO: $repo}')
          cambios=$(jq -n --argjson act "$actuales" --argjson sec "$secretos" --argjson fij "$fijas" \
            '($sec | with_entries(select($act[.key] == null))) + ($fij | with_entries(select($act[.key] != .value)))')
          [ "$cambios" = "{}" ] || h -X PATCH "$API/config-vars" -d "$cambios" > /dev/null
          # Se compila si cambió cms/ o si la app todavía no tiene ninguna versión
          if ! h "$API/formation/web" > /dev/null 2>&1 || git diff --name-only HEAD~1 HEAD | grep -q '^cms/'; then
            echo "compilar=true" >> "$GITHUB_OUTPUT"
          fi
          echo "url=$(h "$API" | jq -r .web_url)" >> "$GITHUB_OUTPUT"
      - name: Compilar y publicar la imagen (amd64)
        if: steps.app.outputs.compilar == 'true'
        run: |
          IMAGEN="registry.heroku.com/$APP/web"
          docker build -t "$IMAGEN" cms
          echo "$HEROKU_API_KEY" | docker login registry.heroku.com --username _ --password-stdin
          docker push "$IMAGEN"
          ID=$(docker inspect "$IMAGEN" --format '{{.Id}}')
          h() { curl -sS --fail-with-body -H "Authorization: Bearer $HEROKU_API_KEY" -H "Content-Type: application/json" "$@"; }
          h -X PATCH "https://api.heroku.com/apps/$APP/formation" -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            -d "{\"updates\":[{\"type\":\"web\",\"docker_image\":\"$ID\"}]}" > /tmp/respuesta.json ||
            { echo "::error::Heroku no aceptó la versión nueva: $(tr -d "
" < /tmp/respuesta.json)"; exit 1; }
      - name: Encender el dyno
        run: |
          # Eco (US$5) o Basic (US$7), según la variable HEROKU_DYNO; los dos entran en el crédito del Student Pack
          curl -sS --fail-with-body -X PATCH "https://api.heroku.com/apps/$APP/formation/web" \
            -H "Accept: application/vnd.heroku+json; version=3" -H "Authorization: Bearer $HEROKU_API_KEY" -H "Content-Type: application/json" \
            -d '{"quantity":1,"size":"${{ vars.HEROKU_DYNO || 'eco' }}"}' > /tmp/respuesta.json ||
            { echo "::error::Heroku no encendió el dyno: $(tr -d "
" < /tmp/respuesta.json)"; exit 1; }
      - name: Dirección del CMS
        run: |
          echo "CMS en Heroku: ${{ steps.app.outputs.url }}admin" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ vista previa (GitHub Pages)
  vista-previa:
    needs: compilar
    if: github.event_name != 'schedule' || needs.compilar.outputs.con_aws != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-meetup-events.mjs
      - name: Leer contenido de Strapi
        run: node scripts/fetch-cms.mjs
        env:
          STRAPI_URL: ${{ vars.STRAPI_URL }}
          STRAPI_TOKEN: ${{ secrets.STRAPI_TOKEN }}
      - run: npm run build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - run: node scripts/prefijar-base.mjs "/${{ github.event.repository.name }}"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v5
